name: Sync Shared Docs from Google Drive

on:
  workflow_dispatch:

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Drive SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Sync HTML Files from Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          python scripts/sync_from_gdrive.py

      - name: Update Hub Index
        run: |
          python scripts/update_index.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ hub-data.json
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(docs): sync shared HTML documents from Google Drive"
            git push origin main
          fi