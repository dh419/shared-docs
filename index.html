<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Docs Hub</title>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --sidebar-w: 300px;
    }
    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #273449;
      --accent: #60a5fa;
      --accent-soft: #172554;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .brand .sub {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 0.84rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:hover { border-color: var(--accent); }
    .menu-btn { display: none; }
    .layout {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      z-index: 15;
    }
    .sidebar-head {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.88rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px 20px;
    }
    .month-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      padding: 8px 10px 4px;
      letter-spacing: 0.03em;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 10px;
      margin-bottom: 4px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .nav-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 3px;
    }
    .nav-date {
      font-size: 0.76rem;
      color: var(--muted);
    }
    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }
    .viewer iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .backdrop {
      display: none;
      position: fixed;
      inset: 56px 0 0 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 14;
    }
    @media (max-width: 820px) {
      .menu-btn { display: inline-flex; }
      .brand .sub { display: none; }
      .sidebar {
        position: fixed;
        top: 56px;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .backdrop.open { display: block; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button class="btn menu-btn" id="menuToggle" aria-label="목록 열기">☰ 목록</button>
      <h1>Shared Docs Hub</h1>
      <p class="sub">공유 문서 허브.</p>
    </div>
    <div class="actions">
      <a class="btn" id="openNewTab" href="#" target="_blank" rel="noopener" style="display:none;">새 탭 열기 ↗</a>
      <button class="btn" id="themeToggle" aria-label="테마 전환">🌙 다크</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="문서 목록 사이드바">
      <div class="sidebar-head">
        <input type="search" class="search-input" id="searchInput" placeholder="문서 제목·날짜 검색..." aria-label="문서 검색" />
      </div>
      <div class="nav-scroll" id="navList">
        <div class="empty">불러오는 중...</div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <main class="viewer">
      <iframe id="docFrame" title="공유 문서 뷰어" src="about:blank"></iframe>
    </main>
  </div>

  <script>
    (function () {
      var themeBtn = document.getElementById("themeToggle");
      function syncThemeBtn() {
        var cur = document.documentElement.dataset.theme || "light";
        themeBtn.textContent = cur === "dark" ? "☀️ 라이트" : "🌙 다크";
      }
      themeBtn.addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        syncThemeBtn();
      });
      syncThemeBtn();

      var sidebar = document.getElementById("sidebar");
      var backdrop = document.getElementById("backdrop");
      var menuToggle = document.getElementById("menuToggle");
      function toggleSidebar(force) {
        var open = typeof force === "boolean" ? force : !sidebar.classList.contains("open");
        sidebar.classList.toggle("open", open);
        backdrop.classList.toggle("open", open);
      }
      menuToggle.addEventListener("click", function () { toggleSidebar(); });
      backdrop.addEventListener("click", function () { toggleSidebar(false); });

      var allDocs = [];
      var activePath = "";
      var navList = document.getElementById("navList");
      var searchInput = document.getElementById("searchInput");
      var docFrame = document.getElementById("docFrame");
      var openNewTab = document.getElementById("openNewTab");

      function selectDoc(doc) {
        if (!doc) return;
        activePath = doc.path;
        docFrame.src = "./" + doc.path;
        openNewTab.href = "./" + doc.path;
        openNewTab.style.display = "inline-flex";
        Array.prototype.forEach.call(navList.querySelectorAll(".nav-item"), function (el) {
          el.classList.toggle("active", el.dataset.path === activePath);
        });
        toggleSidebar(false);
      }

      function renderNav(items) {
        if (!items.length) {
          navList.innerHTML = '<div class="empty">표시할 문서가 없습니다.</div>';
          return;
        }
        var groups = {};
        items.forEach(function (d) {
          var m = d.month || (d.date ? d.date.slice(0, 7) : "기타");
          if (!groups[m]) groups[m] = [];
          groups[m].push(d);
        });
        var months = Object.keys(groups).sort().reverse();
        var html = "";
        months.forEach(function (m) {
          html += '<div class="month-label">' + m + '</div>';
          groups[m].forEach(function (d) {
            var act = d.path === activePath ? " active" : "";
            html += '<button type="button" class="nav-item' + act + '" data-path="' + d.path + '">' +
              '<div class="nav-title">' + d.title + '</div>' +
              '<div class="nav-date">' + d.date + '</div>' +
            '</button>';
          });
        });
        navList.innerHTML = html;
        Array.prototype.forEach.call(navList.querySelectorAll(".nav-item"), function (btn) {
          btn.addEventListener("click", function () {
            var found = allDocs.find(function (x) { return x.path === btn.dataset.path; });
            selectDoc(found);
          });
        });
      }

      fetch("./hub-data.json?v=" + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (data) {
          allDocs = data || [];
          renderNav(allDocs);
          if (allDocs.length) selectDoc(allDocs[0]);
        })
        .catch(function () { renderNav([]); });

      searchInput.addEventListener("input", function () {
        var q = searchInput.value.trim().toLowerCase();
        renderNav(allDocs.filter(function (d) {
          return (d.title + " " + d.date + " " + d.path).toLowerCase().indexOf(q) !== -1;
        }));
      });
    })();
  </script>
</body>
</html>
